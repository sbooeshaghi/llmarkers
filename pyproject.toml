[project]
name = "llmarkers"
version = "0.1.0"
description = "Data, analysis, figures, and manuscript sources for LLMarkers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anndata>=0.11",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "nbformat>=5.10",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
