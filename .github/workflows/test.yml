name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Check out pinned mrkr
        run: |
          git clone https://github.com/sbooeshaghi/mrkr.git ../mrkr
          git -C ../mrkr checkout c0e33d6d1450f3e80c1adb3ccdf892b225cb748e
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q
      - run: >-
          uv run --locked ruff check
          analysis/mine_corpus.py
          analysis/build_claim_db.py
          tests
